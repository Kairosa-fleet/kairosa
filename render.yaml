# Render Blueprint — backend API (auto-deploys on push to `main`).
#
# What this defines: the FastAPI backend as a free Docker web service.
# What it does NOT define: the database and Redis. Those are deliberately
# EXTERNAL free services (Neon + Upstash) rather than Render's own, because
# Render's free Postgres EXPIRES 30 days after creation — fine for a weekend,
# useless for a testing phase. Neon's free Postgres is permanent and has
# PostGIS, which this app requires. See DEPLOYMENT.md.
#
# Connect this repo in the Render dashboard (New → Blueprint) and Render reads
# this file. Every push to `main` then redeploys automatically.

services:
  - type: web
    name: kairosa-backend
    runtime: docker
    repo: https://github.com/Kairosa-fleet/kairosa
    branch: main
    plan: free
    region: singapore          # closest Render region to India
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health

    # No dockerCommand override on purpose. The image's own CMD (backend/start.sh)
    # runs `alembic upgrade head` and then binds Render's injected $PORT. An
    # inline `sh -c "…"` here gets re-wrapped by Render's shell and the nested
    # quotes break — that is what caused the first deploy's "status 127".

    envVars:
      - key: ENVIRONMENT
        value: production        # hides /docs, switches off debug logging
      - key: DEBUG
        value: "false"
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org

      # Render generates a strong secret once and keeps it — you never see or
      # manage it, and it does not live in git.
      - key: JWT_SECRET
        generateValue: true

      # sync:false = "I will paste this secret in the dashboard." Never commit
      # these. See DEPLOYMENT.md for exactly where each value comes from.
      - key: DATABASE_URL          # Neon connection string (must include ?sslmode=require)
        sync: false
      - key: REDIS_URL             # Upstash Redis URL (rediss://…)
        sync: false
      - key: CORS_ORIGINS          # your Vercel web URL, e.g. https://fleet.vercel.app
        sync: false
      - key: PUBLIC_WEB_URL        # same Vercel URL — baked into customer tracking links
        sync: false
      - key: MAPTILER_KEY          # your MapTiler key (server-side geocoding/routing proxy)
        sync: false

      # Cloudflare R2 (S3-compatible) — WITHOUT these, uploaded document scans
      # are written to the container's ephemeral disk and lost on every deploy.
      # See DEPLOYMENT.md "Object storage" for how to obtain each value.
      - key: S3_ENDPOINT_URL       # https://<accountid>.r2.cloudflarestorage.com
        sync: false
      - key: S3_BUCKET             # your R2 bucket name, e.g. kairosa-documents
        sync: false
      - key: S3_ACCESS_KEY_ID      # R2 API token — Access Key ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY  # R2 API token — Secret Access Key
        sync: false
